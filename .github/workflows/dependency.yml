name: dependency

on:
  push:
    branches:
      - "renovate/*"

jobs:
  deduplicate:
    runs-on: ubuntu-latest
    steps:
      - id: step_find_pr
        name: Find pull request
        uses: jwalton/gh-find-current-pr@f3d61b485d2801773f7a07b2aaa3306bd8f8e653 # v1.3.5

      - name: Checkout code repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_GITHUB_TOKEN }}
        if: ${{ steps.step_find_pr.outputs.number }}

      - name: Enable Corepack
        run: |
          corepack enable
          pnpm --version

      - name: Run pnpm dedupe
        run: |
          if $(git log -1 --pretty=format:'%an' | egrep -q 'renovate'); then
            echo "deduplicate lockfile"
            pnpm dedupe
          else
            echo "Skipping lockfile deduplication"
          fi
        if: ${{ steps.step_find_pr.outputs.number }}

      - name: Push to GitHub
        continue-on-error: true
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "chore(deps): deduplicate pnpm-lock.yaml"
          git push
        if: ${{ steps.step_find_pr.outputs.number }}
